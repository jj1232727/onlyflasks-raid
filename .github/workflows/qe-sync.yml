name: Run queued QE sims

# Healers paste a /simc on the board; QE only computes in a browser, so this
# drives QE Live for whoever is queued and saves the scores back.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: qe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install a browser for playwright
        run: npx playwright install --with-deps chromium
      - name: Drive QE Live for queued healers
        run: npm run qe:sync
