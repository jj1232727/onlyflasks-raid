name: Run queued QE sims

# Healers paste a /simc on the board; QE only computes in a browser, so this
# drives QE Live for whoever is queued and saves the scores back.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: qe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Most runs have nothing to do. Ask first, so an empty queue does not
      # download a browser or touch questionablyepic.com at all.
      - name: Anything queued?
        id: queue
        run: |
          COUNT=$(node scripts/qe-sync.js --count)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT healer(s) queued."

      - name: Install a browser for playwright
        if: steps.queue.outputs.count != '0'
        run: npx playwright install --with-deps chromium

      - name: Drive QE Live for queued healers
        if: steps.queue.outputs.count != '0'
        run: npm run qe:sync
