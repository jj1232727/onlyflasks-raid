name: Run queued QE sims

# QE computes in about a second, so the cost here is all start-up. The board
# fires repository_dispatch the moment a healer pastes; the schedule is only a
# safety net for a dispatch that never arrived.
on:
  repository_dispatch:
    types: [qe-sync]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: qe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # A dispatch always has work; the schedule usually does not, and an empty
      # run should not download a browser or touch questionablyepic.com.
      - name: Anything queued?
        id: queue
        run: |
          COUNT=$(node scripts/qe-sync.js --count)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT healer(s) queued."

      # Reusing the browser across runs is most of the wall clock.
      - name: Cache the playwright browser
        if: steps.queue.outputs.count != '0'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # On a cache hit this used to spend ~22s in apt for system libraries the
      # runner image usually already has - longer than the whole QE run now
      # takes. Try the cached browser first and only pay for apt if it will not
      # actually start, so a thinner runner image still self-heals.
      - name: Install a browser for playwright
        if: steps.queue.outputs.count != '0'
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            if node -e "import('playwright-core').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); })"; then
              echo "Cached browser launches as-is; skipping apt."
            else
              echo "Cached browser will not start; installing system deps."
              npx playwright install-deps chromium
            fi
          else
            npx playwright install --with-deps chromium
          fi

      - name: Drive QE Live for queued healers
        if: steps.queue.outputs.count != '0'
        run: npm run qe:sync
