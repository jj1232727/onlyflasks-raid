name: Refresh raid data

# The board renders a committed snapshot, so "fresh" means re-running the
# importers on a schedule and committing what changes. Deploy runs on push,
# so a data commit publishes itself.
on:
  schedule:
    # Every 2 hours, plus a tight pass right after the Tuesday 15:00 UTC reset.
    - cron: "0 */2 * * *"
    - cron: "10,40 15 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Pull roster, gear, activity and Raider.IO
        env:
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
          WOWAUDIT_BASE_URL: ${{ vars.WOWAUDIT_BASE_URL || 'https://wowaudit.com' }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: npm run audit:refresh

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/loot-data.json
          if git diff --staged --quiet; then
            echo "No data changed."
          else
            git commit -m "Refresh raid data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
