name: Refresh raid data

# The board renders a committed snapshot, so "fresh" means re-running the
# importers on a schedule and committing what changes. Deploy runs on push,
# so a data commit publishes itself.
on:
  schedule:
    # Every 2 hours, plus a tight pass right after the Tuesday 15:00 UTC reset.
    - cron: "0 */2 * * *"
    - cron: "10,40 15 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Pull roster, gear, activity and Raider.IO
        env:
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
          WOWAUDIT_BASE_URL: ${{ vars.WOWAUDIT_BASE_URL || 'https://wowaudit.com' }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: npm run audit:refresh

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/loot-data.json
          if git diff --staged --quiet; then
            echo "No data changed."
            exit 0
          fi
          git commit -m "Refresh raid data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # This job runs for a minute or two, so anything pushed meanwhile makes
          # the push a non-fast-forward and the whole refresh fails - losing data
          # that was fetched perfectly well. Replay onto the new tip instead.
          #
          # These files are regenerated in full every run, so on a conflict this
          # commit is by definition the newer one: -X theirs keeps it (in a
          # rebase "theirs" is the patch being applied, not the upstream). The
          # commit only ever stages data/ and public/loot-data.json, so nothing
          # else can be overwritten by that.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the new tip."
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "Still could not push after three attempts."
          exit 1
